name: Browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "go/**"
      - "data/**"
      - "public/data/**"
      - "scripts/build_go_pages.py"
      - "scripts/automation/**"
      - "tests/e2e/go_site_smoke.py"
      - ".github/workflows/browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "go/**"
      - "data/**"
      - "public/data/**"
      - "scripts/build_go_pages.py"
      - "scripts/automation/**"
      - "tests/e2e/go_site_smoke.py"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-web:
    name: go-wasm-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Run Ruby migration gate
        run: ruby scripts/automation/migration_gate.rb

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: go/web-ui/go.mod

      - name: Install browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build Go/WebAssembly test site
        run: python scripts/build_go_pages.py

      - name: Audit Go smoke artifact
        run: ruby scripts/automation/artifact_audit.rb go-pages

      - name: Run Chromium smoke
        run: python tests/e2e/go_site_smoke.py
