name: Deep repair, validate and build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-repair-manual
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate data and discovery state
        run: node scripts/quality-gate.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Rust/Dioxus web UI
        run: cargo check --manifest-path rust/web-ui/Cargo.toml --target wasm32-unknown-unknown
      - name: Identity and data-contract tests
        run: npm test
