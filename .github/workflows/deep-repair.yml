name: Deep repair, validate and build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-repair-manual
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate data and discovery state
        run: node scripts/quality-gate.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build production site
        run: npm run build
      - name: Identity and data-contract tests
        run: npm test
