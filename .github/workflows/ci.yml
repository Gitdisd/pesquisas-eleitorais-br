name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/data/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Run Ruby migration gate
        run: ruby scripts/automation/migration_gate.rb

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: go/web-ui/go.mod

      - name: Install Python application/test package
        run: python -m pip install -e "./python[test]"

      - name: Python tests
        run: python -m pytest python/tests -q

      - name: Real-data rolling backtest
        run: python python/scripts/run_backtest.py data/polls.json --output backtest-report.json

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: polling-backtest-${{ github.sha }}
          path: backtest-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Fieldwork overlap audit
        run: python python/scripts/run_overlap_audit.py data/polls.json --output overlap-report.json

      - name: Upload overlap report
        uses: actions/upload-artifact@v4
        with:
          name: overlap-audit-${{ github.sha }}
          path: overlap-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Build Go/WebAssembly Pages artifact
        run: python scripts/build_go_pages.py

      - name: Audit Go/WebAssembly artifact
        run: ruby scripts/automation/artifact_audit.rb go-pages

      - name: Go source formatting
        working-directory: go/web-ui
        run: gofmt -w main.go && git diff --exit-code -- main.go

      - name: Go WebAssembly compile check
        working-directory: go/web-ui
        run: GOOS=js GOARCH=wasm go build -trimpath -ldflags=-s -w -o /tmp/pesquisas-web.wasm .
