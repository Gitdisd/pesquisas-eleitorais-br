name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/data/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Syntax check scripts and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Typecheck
        run: npm run typecheck
      - name: Rust tests
        run: cargo test --manifest-path rust/polling-core/Cargo.toml
      - name: Python tests
        run: |
          python -m pip install -e "./python[test]"
          python -m pytest python/tests -q
      - name: Real-data rolling backtest
        run: |
          python python/scripts/run_backtest.py data/polls.json --output backtest-report.json

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: polling-backtest-${{ github.sha }}
          path: backtest-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Canonical estimator equivalence
        run: npx --yes tsx@4.23.15 scripts/check-estimator-equivalence.mjs
      - name: Fieldwork overlap audit
        run: python python/scripts/run_overlap_audit.py data/polls.json --output overlap-report.json

      - name: Upload overlap report
        uses: actions/upload-artifact@v4
        with:
          name: overlap-audit-${{ github.sha }}
          path: overlap-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Advanced model rolling backtest
        run: npm run backtest:advanced
      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build Rust/WASM package
        run: npm run build:rust

      - name: WASM/JS parity
        run: npx --yes tsx@4.23.15 scripts/check-wasm-parity.mjs

      - name: Upload Rust/WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package-${{ github.sha }}
          path: public/wasm/polling-core
          if-no-files-found: error
          retention-days: 30

      - name: Canonical estimator equivalence
        run: npx --yes tsx@4.23.15 scripts/check-estimator-equivalence.mjs

      - name: Upload advanced backtest report
        uses: actions/upload-artifact@v4
        with:
          name: advanced-backtest-${{ github.sha }}
          path: advanced-backtest-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Build
        run: npm run build
      - name: Identity and data-contract tests
        run: npm test
      - name: Quality gate
        run: node scripts/quality-gate.mjs
      - name: Integrity audit
        run: node scripts/quality-audit.mjs
