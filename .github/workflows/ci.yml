name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/data/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check scripts and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Identity and data-contract tests
        run: npm test
      - name: Quality gate
        run: node scripts/quality-gate.mjs
      - name: Integrity audit
        run: node scripts/quality-audit.mjs
