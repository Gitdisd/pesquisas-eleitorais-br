name: One-off package lock repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_oneoff-sync-package-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Regenerate package lock from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize package lock"
          git push
