name: Emergency national-data repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Repair broken typed-data wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("import { loadPollData } from './data/api.ts'", "import { loadPollData, loadMeta } from './data/api.ts'"),
              ("    state.meta = meta\n    state.updatedLabel = resolveUpdatedStamp(meta, state.polls)", "    state.meta = bundle.meta\n    state.updatedLabel = resolveUpdatedStamp(bundle.meta, state.polls)"),
              ("    setStamp(); applyCheckMeta(meta); startCheckTimers()", "    setStamp(); applyCheckMeta(bundle.meta); startCheckTimers()"),
              ("      loadMeta(true),", "      loadMeta(META_URL, true),"),
              ("    const nextPolls = normalize(nextRaw)", "    const nextPolls = normalizePolls(nextRaw)"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected source pattern not found: {old!r}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          node scripts/quality-gate.mjs
          npm run build
      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/emergency-national-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js .github/workflows/emergency-national-fix.yml
          git commit -m 'hotfix: repair national boot'
          git push
