name: Wire average model toggle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire models 3 and 4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          c = Path('src/chart.js')
          t = c.read_text()
          t = t.replace('institute: p.meta.institute }))', 'institute: p.meta.institute, moe: p.meta.moe }))')
          t = t.replace('const avgModel = model === 2 ? 2 : 1', 'const avgModel = model >= 3 ? model : model === 2 ? 2 : 1')
          c.write_text(t)

          m = Path('src/main.js')
          u = m.read_text()
          u = u.replace('n: p.n, institute: p.institute }))', 'n: p.n, institute: p.institute, moe: p.moe }))')
          u = u.replace(
              'const avgModel = Number(window.__pebrProjModel || 0) === 2 ? 2 : 1',
              'const rawM = Number(window.__pebrProjModel || 0)\n    const avgModel = rawM >= 3 ? rawM : rawM === 2 ? 2 : 1',
          )
          m.write_text(u)

          o = Path('src/live-overlay.js')
          v = o.read_text()
          if 'data-proj-model="3"' not in v:
              v = v.replace(
                  '<button type="button" class="chip" data-proj-model="2">Modelo 2</button>',
                  '<button type="button" class="chip" data-proj-model="2">Modelo 2</button>\n    <button type="button" class="chip" data-proj-model="3">Modelo 3</button>\n    <button type="button" class="chip" data-proj-model="4">Modelo 4</button>',
              )
          v = v.replace('<span class="ctrl">Projeção</span>', '<span class="ctrl">Média</span>')
          v2, n = re.subn(
              r"hint\.textContent =\s*n === 2\s*\?[\s\S]*?: hint\.textContent",
              "const copy = {\n      1: 'Modelo 1: média antiga.',\n      2: 'Modelo 2: meia-vida + house.',\n      3: 'Modelo 3: meta-análise de efeitos aleatórios. Peso = recência / (erro amostral + tau entre pesquisas). N e margem entram.',\n      4: 'Modelo 4: intencao latente (Kalman). Cada pesquisa atualiza a corrida pelo erro amostral; nao e previsao de urna.',\n    }\n    hint.textContent = copy[n] || hint.textContent",
              v,
              count=1,
          )
          print('hint', n)
          o.write_text(v2 if n else v)
          print('done')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chart.js src/main.js src/live-overlay.js
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "ui: add Modelo 3 and Modelo 4 plot chips"
          git push
