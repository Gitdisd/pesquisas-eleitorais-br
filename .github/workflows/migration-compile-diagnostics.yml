name: Migration compile diagnostics

on:
  push:
    branches: [migration-rust-ui-2026-09-23]
    paths-ignore:
      - "docs/ci-diagnostics/**"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Run web UI compile and capture output
        shell: bash
        run: |
          set +e
          cargo check --manifest-path rust/web-ui/Cargo.toml --target wasm32-unknown-unknown 2>&1 | tee /tmp/web-ui-cargo-check.log
          rc=\${PIPESTATUS[0]}
          exit "\${rc}"
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-cargo-check-${{ github.sha }}
          path: /tmp/web-ui-cargo-check.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit compiler diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ci-diagnostics
          cat /tmp/web-ui-cargo-check.log > "docs/ci-diagnostics/web-ui-cargo-check-\${GITHUB_SHA}.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci-diagnostics/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(migration): record web-ui compile diagnostics"
          git push origin "HEAD:\${GITHUB_REF_NAME}"
