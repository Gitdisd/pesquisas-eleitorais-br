name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm install

      - name: Install PDF text + OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por unzip

      - name: Repair data for deployment
        run: |
          node scripts/apply-corrections.mjs
          node scripts/repair-known-missing-candidates.mjs
          node scripts/expand-discovery-candidates.mjs
          node scripts/recover-poll-documents.mjs || true
          node scripts/strip-ineligible-candidates.mjs
          node scripts/merge-poll-supplements.mjs
          node scripts/data-completeness-audit.mjs
          node scripts/quality-audit.mjs

      - name: Synchronize repaired data mirrors and metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'

          const polls = JSON.parse(fs.readFileSync('data/polls.json', 'utf8'))
          const canonical = JSON.stringify(polls)
          const meta = JSON.parse(fs.readFileSync('data/meta.json', 'utf8'))
          meta.record_count = polls.length
          meta.content_hash = crypto.createHash('sha256').update(canonical).digest('hex')

          fs.mkdirSync('public/data', { recursive: true })
          fs.writeFileSync('data/meta.json', `${JSON.stringify(meta, null, 2)}\n`)
          fs.copyFileSync('data/polls.json', 'public/data/polls.json')
          fs.copyFileSync('data/meta.json', 'public/data/meta.json')
          NODE

      - name: Validate repaired deployment dataset
        run: node scripts/quality-gate.mjs

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
