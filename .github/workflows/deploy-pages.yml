name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Ruby migration gate
        run: ruby scripts/automation/migration_gate.rb

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: go/web-ui/go.mod

      - name: Install Python application/test package
        run: python -m pip install -e "./python[test]"

      - name: Run Python data/statistics tests
        run: python -m pytest python/tests -q

      - name: Build Go/WebAssembly Pages site
        run: python scripts/build_go_pages.py

      - name: Stage Pages artifact
        run: |
          set -euo pipefail
          rm -rf pages-artifact
          mkdir -p pages-artifact/data
          cp go-pages/index.html pages-artifact/index.html
          cp go-pages/404.html pages-artifact/404.html
          cp go-pages/main.wasm pages-artifact/main.wasm
          cp go-pages/wasm_exec.js pages-artifact/wasm_exec.js
          cp go-pages/polls.json pages-artifact/data/polls.json
          cp go-pages/meta.json pages-artifact/data/meta.json
          cp go-pages/polls-extra.json pages-artifact/data/polls-extra.json
          cp go-pages/polls-regional.json pages-artifact/data/polls-regional.json
          test -f pages-artifact/index.html
          test -f pages-artifact/404.html
          test -f pages-artifact/main.wasm
          test -f pages-artifact/wasm_exec.js

      - name: Audit staged Pages artifact with Ruby
        run: ruby scripts/automation/artifact_audit.rb pages-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify deployed Pages site with Ruby
        run: ruby scripts/automation/deployment_verify.rb "${{ needs.deploy.outputs.page_url }}"
