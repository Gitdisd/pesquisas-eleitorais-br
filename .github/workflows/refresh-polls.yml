name: Refresh polls

on:
  schedule:
    # Hourly at :10 UTC.
    # Bots-offline: this job alone runs discover then update then commit.
    - cron: "10 * * * *"
  workflow_dispatch:

# Overlapping crons must not race-corrupt data commits.
concurrency:
  group: refresh-polls
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Discover new polls (headless)
        id: discover
        continue-on-error: true
        run: |
          set +e
          npm run discover-polls
          code=$?
          echo "discover_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::discover-polls exited $code — continuing so meta/last_check still updates"
          fi
          exit 0

      - name: Update polls
        env:
          POLL_SOURCE_URL: ${{ secrets.POLL_SOURCE_URL }}
        run: npm run update-polls

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ public/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh polls"
          git push
