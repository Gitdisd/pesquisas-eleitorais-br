name: Refresh polls

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-polls
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF text + OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por unzip

      - name: Apply verified data corrections
        run: node scripts/apply-corrections.mjs

      - name: Discover new polls (broad web pass)
        run: npm run discover-polls

      - name: Run TSE registry recovery and cross-check
        shell: bash
        run: |
          set +e
          npm run poll-pipeline
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "Registry pipeline found missing or conflicting evidence; reports were written and the site data remains conservative."
            exit 0
          fi
          exit "$rc"

      - name: Publish pipeline status for the site
        run: node scripts/publish-pipeline-status.mjs

      - name: Run deterministic integrity audit
        run: node scripts/quality-audit.mjs

      - name: Update polls
        env:
          POLL_SOURCE_URL: ${{ secrets.POLL_SOURCE_URL }}
          CHECK_INTERVAL_MINUTES: "60"
        run: npm run update-polls

      - name: Validate data and discovery state
        run: node scripts/quality-gate.mjs

      - name: Build production site
        run: npm run build

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ public/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh and audit polls"
          git push
