[package]
name = "pebr-web-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["web", "minimal"] }
gloo-net = { version = "0.7.0", features = ["http"] }
gloo-timers = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
polling-core = { path = "../polling-core" }

[target."cfg(target_arch = \"wasm32\")".dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "Storage", "Url", "UrlSearchParams", "Navigator", "Clipboard", "HtmlAnchorElement"] }
