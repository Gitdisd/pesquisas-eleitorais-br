[package]
name = "polling-core"
version = "0.1.0"
edition = "2021"
description = "Statistical core for the Brazilian polling aggregator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = "1"
